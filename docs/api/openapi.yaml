openapi: 3.1.0
info:
  title: CodeWalnut BD Platform API
  version: 0.1.0
  description: |
    REST API for release 1 (docs/scope.md). Served under /api/v1 by the single
    Spring Boot application (ADR-0003). Authentication is a session cookie set
    by Google Workspace sign-in (ADR-0004); state-changing calls need the
    XSRF-TOKEN cookie echoed in the X-XSRF-TOKEN header.

    All amounts are INR. Fields marked "restricted" (contract values, bill
    rates) are null unless the caller holds LEADERSHIP, BD_LEAD, DELIVERY or
    ADMIN (FR-EXI-08).

    `x-slice` on each operation says which build slice delivers it:
    1 = sign-in and upload (first slice), 2 = pipeline and activities,
    3 = reports and alerts.
servers:
  - url: /api/v1
tags:
  - name: me
  - name: imports
  - name: accounts
  - name: contacts
  - name: contracts
  - name: talent
  - name: engagement
  - name: opportunities
  - name: reports
  - name: admin
paths:
  /me:
    get:
      tags: [me]
      operationId: getMe
      x-slice: 1
      summary: The signed-in user and their roles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /reference:
    get:
      tags: [admin]
      operationId: getReferenceData
      x-slice: 1
      summary: Stages, seniority rules and picklists for forms
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceData' }

  /imports/{entityType}/validate:
    post:
      tags: [imports]
      operationId: validateImport
      x-slice: 1
      summary: Check a file without saving anything (ADR-0006)
      parameters:
        - $ref: '#/components/parameters/EntityType'
      requestBody:
        $ref: '#/components/requestBodies/ImportFile'
      responses:
        '200':
          description: Validation report. `valid` is false when any row fails.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportReport' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /imports/{entityType}/commit:
    post:
      tags: [imports]
      operationId: commitImport
      x-slice: 1
      summary: Validate again and save every row in one transaction, or nothing
      description: |
        The client sends the same file it validated; the server does not keep
        files between calls. Returns 422 with the report if any row fails.
      parameters:
        - $ref: '#/components/parameters/EntityType'
      requestBody:
        $ref: '#/components/requestBodies/ImportFile'
      responses:
        '200':
          description: Committed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportReport' }
        '422':
          description: Rows failed validation; nothing was saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportReport' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /imports:
    get:
      tags: [imports]
      operationId: listImportBatches
      x-slice: 1
      summary: Past uploads, newest first
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ImportBatch' }

  /accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: List accounts
      x-slice: 1
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 'Name, parent or domain contains' }
        - { name: relationship, in: query, schema: { $ref: '#/components/schemas/Relationship' } }
        - { name: city, in: query, schema: { type: string } }
        - { name: ownerId, in: query, schema: { type: integer, format: int64 } }
        - { name: researched, in: query, schema: { type: boolean }, description: 'Only accounts with (true) or without (false) finished research' }
        - { name: formedSince, in: query, schema: { type: integer }, description: 'Only centres formed in or after this year' }
        - { name: sizeBand, in: query, schema: { type: string, enum: ['<500', '500-2000', '2000-5000', '5000+'] }, description: 'Recorded band, or the band of the exact employee count' }
        - { name: industry, in: query, schema: { type: string }, description: 'Industry contains' }
        - { name: tech, in: query, schema: { type: string }, description: 'Tech stack has this entry (whole entry, any case)' }
        - { name: sort, in: query, schema: { type: string, enum: [name, fit, fit_asc, newest, smallest, open_roles], default: name }, description: 'fit = highest fit score first (FR-ACC-04); fit_asc = lowest first; newest = latest year formed first; smallest = fewest employees first; open_roles = most open roles first. Unknown values sort last.' }
        - $ref: '#/components/parameters/Page'
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 50 }, description: 'Up to 1000, so the whole list can be ranked on one page' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPage' }
    post:
      tags: [accounts]
      operationId: createAccount
      summary: Create account
      x-slice: 2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '409': { $ref: '#/components/responses/Problem' }

  /connections:
    get:
      tags: [contacts]
      operationId: listConnections
      summary: People the team knows, with who knows them, and growth counts
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: mine, in: query, schema: { type: boolean }, description: Only people the caller knows }
        - { name: accountId, in: query, schema: { type: integer, format: int64 } }
        - { name: linked, in: query, schema: { type: boolean }, description: Linked to a target account or not }
        - { name: strength, in: query, schema: { type: string, enum: [CLOSE, KNOW_WELL, ACQUAINTANCE] } }
      responses:
        '200': { description: '{ items: Connection[], summary: { total, knownByMe, linkedToAccounts, addedLast30Days, weekly: [{ weekStart, added }] (12 weeks) } }' }
    post:
      tags: [contacts]
      operationId: addConnection
      summary: Add a person the caller knows (pipeline roles)
      description: 'Body: { person: { fullName, currentCompany, currentRole, city, linkedinUrl, email, accountId, accountLink (WORKS_THERE or CAN_INTRODUCE), notes }, knowing: { strength, howKnown, connectedOn } }. The same name at the same company is refused: add yourself to the existing one.'
      responses:
        '201': { description: The connection }
        '422': { description: Invalid or already there }
  /connections/{id}:
    get:
      tags: [contacts]
      operationId: getConnection
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: The connection with knownBy }
        '404': { description: No such connection }
    put:
      tags: [contacts]
      operationId: updateConnection
      summary: Edit the person and their account link (pipeline roles); version required to avoid overwriting
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: The connection }
        '409': { description: Changed by someone else }
        '422': { description: Invalid }
  /connections/{id}/knowers/me:
    put:
      tags: [contacts]
      operationId: knowConnection
      summary: 'Add or update how the caller knows them: { strength, howKnown, connectedOn }'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: The connection }
    delete:
      tags: [contacts]
      operationId: forgetConnection
      summary: Remove the caller as a knower; the connection is deleted when nobody knows them
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Done }
  /connections/{id}/contact:
    post:
      tags: [contacts]
      operationId: connectionToContact
      summary: 'Make a contact at the linked account from someone who works there: { persona }'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: The connection with contactId }
        '422': { description: Not linked as working at an account, or invalid persona }
  /connections/for-account/{accountId}:
    get:
      tags: [contacts]
      operationId: warmPaths
      summary: Connections who work at or can introduce us to an account
      parameters: [ { name: accountId, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '200': { description: Connection[] }
  /conversations:
    get:
      tags: [engagement]
      operationId: listConversations
      summary: Conversations with summary counts; open ones with the earliest next step first
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [OPEN, STARTED, REPLIED, MEETING_BOOKED, OPPORTUNITY, GONE_QUIET, CLOSED] }, description: 'OPEN = not closed and not gone quiet' }
        - { name: due, in: query, schema: { type: string, enum: [overdue, week] }, description: 'Open conversations with the next step before today, or within 7 days' }
        - { name: mine, in: query, schema: { type: boolean } }
        - { name: accountId, in: query, schema: { type: integer, format: int64 } }
        - { name: q, in: query, schema: { type: string }, description: 'Account, person or topic contains' }
      responses:
        '200': { description: '{ items: Conversation[], summary: { open, overdue, dueThisWeek, meetingsBooked, opportunities, goneQuiet, startedLast30Days } }' }
    post:
      tags: [engagement]
      operationId: startConversation
      summary: Start a conversation with its first touch (pipeline roles)
      description: 'Body: accountId, contactId or personName, topic, channel, occurredOn, summary, outcome, nextStep, nextStepDue. A next step needs a date.'
      responses:
        '201': { description: '{ conversation, updates }' }
        '422': { description: Invalid, one problem each; nothing is saved }
  /conversations/{id}:
    get:
      tags: [engagement]
      operationId: getConversation
      summary: One conversation with its updates (activities), newest first
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: '{ conversation, updates }' }
        '404': { description: No such conversation }
    patch:
      tags: [engagement]
      operationId: changeConversation
      summary: Change status, next step, owner or linked opportunity without logging a touch (pipeline roles)
      description: 'Body: status, nextStep, nextStepDue, ownerId, opportunityId, version. Linking an opportunity at the same account sets the status to OPPORTUNITY.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: '{ conversation, updates }' }
        '409': { description: Someone else updated it first }
        '422': { description: Invalid }
  /conversations/{id}/updates:
    post:
      tags: [engagement]
      operationId: addConversationUpdate
      summary: Log a touch in the conversation and move its status and next step (pipeline roles)
      description: 'Body: channel, occurredOn, summary, outcome, status (optional; otherwise REPLIED, MEETING_BOOKED and NOT_INTERESTED outcomes set it), nextStep, nextStepDue, version.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: '{ conversation, updates }' }
        '409': { description: Someone else updated it first }
        '422': { description: Invalid }
  /strategy:
    get:
      tags: [strategy]
      operationId: getStrategy
      summary: The current BD strategy (Markdown) and whether the caller may edit it
      responses:
        '200': { description: 'OK: { current: StrategyVersion or null, canEdit: boolean }' }
    put:
      tags: [strategy]
      operationId: saveStrategy
      summary: Save a new version (leadership and admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 50000, description: Markdown }
                note: { type: string, maxLength: 300, description: What changed }
                baseVersionId: { type: integer, format: int64, description: 'The version the edit started from' }
      responses:
        '200': { description: 'The saved version (or the current one if nothing changed)' }
        '403': { description: Not leadership or admin }
        '409': { description: Someone saved a newer version first }
        '422': { description: Empty or too long }
  /strategy/versions:
    get:
      tags: [strategy]
      operationId: listStrategyVersions
      summary: Saved versions, newest first (id, note, editedBy, editedAt)
      responses:
        '200': { description: OK }
  /strategy/versions/{id}:
    get:
      tags: [strategy]
      operationId: getStrategyVersion
      summary: One saved version with its text
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK }
        '404': { description: No such version }
  /accounts/facets:
    get:
      tags: [accounts]
      operationId: accountFacets
      summary: Cities and industries in use, for the filter lists
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cities: { type: array, items: { type: string } }
                  industries: { type: array, items: { type: string } }
  /accounts/{id}/profile:
    put:
      tags: [accounts]
      operationId: updateAccountProfile
      summary: Set year formed, size and open roles; null clears a field (pipeline roles)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountProfile' }
      responses:
        '200': { description: Saved }
        '403': { description: Not a pipeline role }
        '404': { description: No such account }
        '422': { description: Invalid values, one problem each }
  /accounts/{id}:
    get:
      tags: [accounts]
      operationId: getAccount
      x-slice: 1
      summary: One account with its contacts, contracts and deployed team
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDetail' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [accounts]
      operationId: updateAccount
      summary: Update account
      x-slice: 2
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }

  /contacts:
    get:
      tags: [contacts]
      operationId: listContacts
      summary: List contacts
      x-slice: 1
      parameters:
        - { name: accountId, in: query, schema: { type: integer, format: int64 } }
        - { name: persona, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Contact' }

  /contracts:
    get:
      tags: [contracts]
      operationId: listContracts
      summary: List contracts
      x-slice: 1
      parameters:
        - { name: accountId, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, ACTIVE, ENDED] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Contract' }

  /engineers:
    get:
      tags: [talent]
      operationId: listEngineers
      summary: List engineers
      x-slice: 1
      parameters:
        - { name: availability, in: query, schema: { type: string, enum: [DEPLOYED, BENCH, NOTICE, LEAVE] } }
        - { name: seniority, in: query, schema: { $ref: '#/components/schemas/Seniority' } }
        - { name: skill, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Engineer' }

  /deployments:
    get:
      tags: [contracts]
      operationId: listDeployments
      summary: List deployments
      x-slice: 1
      parameters:
        - { name: accountId, in: query, schema: { type: integer, format: int64 } }
        - { name: engineerId, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { type: string, enum: [PLANNED, ACTIVE, ENDED] } }
        - { name: endingWithinDays, in: query, schema: { type: integer, minimum: 1 }, description: FR-GRO-02 end-date view }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Deployment' }

  /activities:
    get:
      tags: [engagement]
      operationId: listActivities
      summary: List activities
      x-slice: 2
      parameters:
        - { name: accountId, in: query, schema: { type: integer, format: int64 } }
        - { name: contactId, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Activity' }
    post:
      tags: [engagement]
      operationId: logActivity
      x-slice: 2
      summary: Log a touch on any channel (FR-ENG-01). LinkedIn steps are done by people (BR-BD-03).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }

  /opportunities:
    get:
      tags: [opportunities]
      operationId: listOpportunities
      summary: List opportunities
      x-slice: 2
      parameters:
        - { name: accountId, in: query, schema: { type: integer, format: int64 } }
        - { name: ownerId, in: query, schema: { type: integer, format: int64 } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/OpportunityType' } }
        - { name: stage, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Opportunity' }
    post:
      tags: [opportunities]
      operationId: createOpportunity
      summary: Create opportunity
      x-slice: 2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpportunityInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Opportunity' }

  /opportunities/{id}:
    get:
      tags: [opportunities]
      operationId: getOpportunity
      summary: Get opportunity
      x-slice: 2
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Opportunity' }
    patch:
      tags: [opportunities]
      operationId: updateOpportunity
      summary: Update opportunity
      x-slice: 2
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpportunityInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Opportunity' }

  /opportunities/{id}/stage:
    post:
      tags: [opportunities]
      operationId: moveOpportunityStage
      x-slice: 2
      summary: Move to another stage, enforcing BR-BD-07, BR-BD-08, BR-BD-12 and BR-BD-13
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage: { type: string }
                lossReasonCode: { type: string, description: Required when stage is LOST }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Opportunity' }
        '422': { $ref: '#/components/responses/Problem' }

  /reports/funnel:
    get:
      tags: [reports]
      operationId: getFunnel
      summary: Get funnel
      x-slice: 3
      responses:
        '200': { description: Counts per stage by owner and month (FR-REP-01) }
  /reports/forecast:
    get:
      tags: [reports]
      operationId: getForecast
      summary: Get forecast
      x-slice: 3
      responses:
        '200': { description: Weighted INR by month and type (FR-REP-02) }
  /reports/bench:
    get:
      tags: [reports]
      operationId: getBench
      summary: Get bench
      x-slice: 3
      responses:
        '200': { description: Utilisation and upcoming roll-offs (FR-REP-04) }

  /users:
    get:
      tags: [admin]
      operationId: listPeople
      x-slice: 2
      summary: Active people with a role (id and name only), for owner pickers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, format: int64 }
                    name: { type: string }

  /admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: List users
      x-slice: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/users/{id}/roles:
    put:
      tags: [admin]
      operationId: setUserRoles
      summary: Set user roles
      x-slice: 1
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    Size: { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    EntityType:
      name: entityType
      in: path
      required: true
      schema: { type: string, enum: [accounts, contacts, contracts, engineers, deployments] }

  requestBodies:
    ImportFile:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
                description: CSV or XLSX in the template's column layout, at most 5 MB

  responses:
    Unauthorized: { description: Not signed in }
    Forbidden: { description: Signed in but the role does not allow this }
    Problem:
      description: Error (RFC 9457 problem details)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        problems:
          type: array
          items: { type: string }
          description: On 422, every business rule not met, one message each

    Role:
      type: string
      enum: [LEADERSHIP, BD_LEAD, ACCOUNT_EXECUTIVE, DELIVERY, SOLUTIONS, ADMIN]
    Seniority:
      type: string
      enum: [JUNIOR, MID, SENIOR, LEAD, PRINCIPAL]
    Relationship:
      type: string
      enum: [PROSPECT, CLIENT, PAST_CLIENT]
    OpportunityType:
      type: string
      enum: [STAFF_AUGMENTATION, PROJECT]
    RateUnit:
      type: string
      enum: [MONTH, DAY, HOUR]

    Me:
      type: object
      required: [id, email, name, roles, canSeeRestricted]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        name: { type: string }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        canSeeRestricted: { type: boolean, description: May see rates and contract values }
        canImport: { type: boolean }

    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        name: { type: string }
        active: { type: boolean }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        lastLoginAt: { type: string, format: date-time }

    ReferenceData:
      type: object
      properties:
        stages:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              label: { type: string }
              defaultProbability: { type: integer }
              outcome: { type: string, enum: [OPEN, WON, LOST] }
        seniorityRules:
          type: array
          items:
            type: object
            properties:
              seniority: { $ref: '#/components/schemas/Seniority' }
              maxConcurrentClients: { type: integer }
        picklists:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                code: { type: string }
                label: { type: string }

    ImportReport:
      type: object
      required: [entityType, fileName, totalRows, valid, errors]
      properties:
        entityType: { type: string }
        fileName: { type: string }
        totalRows: { type: integer }
        valid: { type: boolean }
        toCreate: { type: integer }
        toUpdate: { type: integer }
        committed: { type: boolean }
        batchId: { type: integer, format: int64 }
        errors:
          type: array
          items: { $ref: '#/components/schemas/RowError' }
    RowError:
      type: object
      required: [row, message]
      properties:
        row: { type: integer, description: 'Spreadsheet row number; the header is row 1' }
        column: { type: string }
        value: { type: string }
        message: { type: string }
    ImportBatch:
      type: object
      properties:
        id: { type: integer, format: int64 }
        entityType: { type: string }
        fileName: { type: string }
        status: { type: string, enum: [FAILED, COMMITTED] }
        totalRows: { type: integer }
        createdCount: { type: integer }
        updatedCount: { type: integer }
        failedCount: { type: integer }
        uploadedBy: { type: string }
        uploadedAt: { type: string, format: date-time }

    Account:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        parentCompany: { type: string }
        parentHqCountry: { type: string }
        city: { type: string }
        websiteDomain: { type: string }
        industry: { type: string }
        headcountBand: { type: string }
        yearEstablished: { type: integer }
        techStack: { type: array, items: { type: string } }
        relationship: { $ref: '#/components/schemas/Relationship' }
        ownerId: { type: integer, format: int64 }
        ownerName: { type: string }
        source: { type: string }
        notes: { type: string }
        activeEngineers: { type: integer }
        employeeCount: { type: integer, nullable: true }
        openRoles: { type: integer, nullable: true }
        openRolesAsOf: { type: string, format: date, nullable: true }
        openRolesSource: { type: string, nullable: true }
        researchedAt: { type: string, format: date-time, nullable: true }
        fitScore: { type: integer, nullable: true }
        fitReasons: { type: array, items: { type: string } }
    AccountProfile:
      type: object
      description: Targeting facts. An exact employeeCount also sets the band. openRolesAsOf defaults to today when openRoles is given.
      properties:
        yearEstablished: { type: integer, minimum: 1900, nullable: true }
        headcountBand: { type: string, enum: ['<500', '500-2000', '2000-5000', '5000+'], nullable: true }
        employeeCount: { type: integer, minimum: 0, nullable: true }
        openRoles: { type: integer, minimum: 0, nullable: true }
        openRolesAsOf: { type: string, format: date, nullable: true }
        openRolesSource: { type: string, maxLength: 500, nullable: true }
    AccountInput:
      type: object
      required: [name, parentCompany, city, websiteDomain, relationship, ownerId, source]
      properties:
        name: { type: string }
        parentCompany: { type: string }
        parentHqCountry: { type: string }
        city: { type: string }
        websiteDomain: { type: string }
        industry: { type: string }
        headcountBand: { type: string }
        yearEstablished: { type: integer }
        techStack: { type: array, items: { type: string } }
        relationship: { $ref: '#/components/schemas/Relationship' }
        ownerId: { type: integer, format: int64 }
        source: { type: string }
        notes: { type: string }
    AccountPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Account' } }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
    AccountDetail:
      allOf:
        - $ref: '#/components/schemas/Account'
        - type: object
          properties:
            contacts: { type: array, items: { $ref: '#/components/schemas/Contact' } }
            contracts: { type: array, items: { $ref: '#/components/schemas/Contract' } }
            deployments: { type: array, items: { $ref: '#/components/schemas/Deployment' } }
            monthlyBillingInr:
              type: number
              description: Restricted. Sum of active monthly-equivalent bill rates.

    Contact:
      type: object
      properties:
        id: { type: integer, format: int64 }
        accountId: { type: integer, format: int64 }
        accountName: { type: string }
        fullName: { type: string }
        title: { type: string }
        persona: { type: string }
        linkedinUrl: { type: string }
        email: { type: string }
        phone: { type: string }
        city: { type: string }
        source: { type: string }
        consentBasis: { type: string, enum: [EXISTING_RELATIONSHIP, BUSINESS_CONTACT, CONSENTED] }
        optedOut: { type: boolean }

    Contract:
      type: object
      properties:
        id: { type: integer, format: int64 }
        contractRef: { type: string }
        accountId: { type: integer, format: int64 }
        accountName: { type: string }
        contractType: { type: string, enum: [MSA, SOW] }
        parentMsaRef: { type: string }
        workType: { type: string, enum: [STAFF_AUGMENTATION, PROJECT] }
        pricingModel: { type: string, enum: [MONTHLY_RATE, TIME_AND_MATERIALS, FIXED_PRICE] }
        totalValueInr: { type: number, description: Restricted }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        renewalDate: { type: string, format: date }
        status: { type: string, enum: [DRAFT, ACTIVE, ENDED] }
        clientPermissionToName: { type: boolean }

    Engineer:
      type: object
      properties:
        id: { type: integer, format: int64 }
        employeeCode: { type: string }
        fullName: { type: string }
        workEmail: { type: string }
        primaryRole: { type: string }
        seniority: { $ref: '#/components/schemas/Seniority' }
        skills: { type: array, items: { type: string } }
        location: { type: string }
        availability: { type: string, enum: [DEPLOYED, BENCH, NOTICE, LEAVE] }
        availableFrom: { type: string, format: date }
        consentToShareProfile: { type: boolean }
        currentAllocationPercent: { type: integer, description: Sum over active deployments today }

    Deployment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        engineerId: { type: integer, format: int64 }
        engineerName: { type: string }
        employeeCode: { type: string }
        seniority: { $ref: '#/components/schemas/Seniority' }
        accountId: { type: integer, format: int64 }
        accountName: { type: string }
        sowRef: { type: string }
        teamOrProject: { type: string }
        role: { type: string }
        clientManagerName: { type: string }
        allocationPercent: { type: integer }
        billRateInr: { type: number, description: Restricted }
        rateUnit: { $ref: '#/components/schemas/RateUnit' }
        startDate: { type: string, format: date }
        expectedEndDate: { type: string, format: date }
        status: { type: string, enum: [PLANNED, ACTIVE, ENDED] }

    Activity:
      type: object
      properties:
        id: { type: integer, format: int64 }
        accountId: { type: integer, format: int64 }
        contactId: { type: integer, format: int64 }
        userName: { type: string }
        channel: { type: string }
        occurredOn: { type: string, format: date }
        summary: { type: string }
        outcome: { type: string }
    ActivityInput:
      type: object
      required: [accountId, channel, occurredOn, summary, outcome]
      properties:
        accountId: { type: integer, format: int64 }
        contactId: { type: integer, format: int64 }
        channel: { type: string, enum: [LINKEDIN_CONNECTION, LINKEDIN_MESSAGE, INMAIL, EMAIL, CALL, MEETING, EVENT, REFERRAL] }
        occurredOn: { type: string, format: date }
        summary: { type: string, maxLength: 2000 }
        outcome: { type: string, enum: [NO_REPLY, REPLIED, MEETING_BOOKED, NOT_INTERESTED, REFERRED_ON, DONE] }

    Requirement:
      type: object
      required: [role, skills, seniority, headcount, locationMode, startDate]
      properties:
        id: { type: integer, format: int64 }
        role: { type: string }
        skills: { type: array, items: { type: string } }
        seniority: { $ref: '#/components/schemas/Seniority' }
        headcount: { type: integer, minimum: 1 }
        locationMode: { type: string, enum: [ONSITE, HYBRID, REMOTE] }
        location: { type: string }
        startDate: { type: string, format: date }
        durationMonths: { type: integer }
        allocationPercent: { type: integer, minimum: 1, maximum: 100 }
        rateInr: { type: number }
        rateUnit: { $ref: '#/components/schemas/RateUnit' }
    Opportunity:
      type: object
      properties:
        id: { type: integer, format: int64 }
        accountId: { type: integer, format: int64 }
        accountName: { type: string }
        name: { type: string }
        type: { $ref: '#/components/schemas/OpportunityType' }
        ownerId: { type: integer, format: int64 }
        ownerName: { type: string }
        stage: { type: string }
        stageLabel: { type: string }
        stageOutcome: { type: string, enum: [OPEN, WON, LOST] }
        valueInr: { type: number }
        probability: { type: integer }
        weightedValueInr: { type: number }
        expectedCloseDate: { type: string, format: date }
        decisionMakerContactId: { type: integer, format: int64 }
        needSummary: { type: string }
        targetStartDate: { type: string, format: date }
        lossReasonCode: { type: string }
        requirements: { type: array, items: { $ref: '#/components/schemas/Requirement' } }
        scopeSummary: { type: string }
        pricingModel: { type: string, enum: [FIXED_PRICE, TIME_AND_MATERIALS] }
        estimateInr: { type: number }
        version: { type: integer }
        history:
          type: array
          items:
            type: object
            properties:
              fromStage: { type: string }
              toStage: { type: string }
              changedBy: { type: string }
              changedAt: { type: string, format: date-time }
    OpportunityInput:
      type: object
      required: [accountId, name, type, ownerId]
      properties:
        accountId: { type: integer, format: int64 }
        name: { type: string }
        type: { $ref: '#/components/schemas/OpportunityType' }
        ownerId: { type: integer, format: int64 }
        valueInr: { type: number }
        probability: { type: integer }
        expectedCloseDate: { type: string, format: date }
        decisionMakerContactId: { type: integer, format: int64 }
        needSummary: { type: string }
        targetStartDate: { type: string, format: date }
        requirements: { type: array, items: { $ref: '#/components/schemas/Requirement' } }
        scopeSummary: { type: string }
        pricingModel: { type: string, enum: [FIXED_PRICE, TIME_AND_MATERIALS] }
        estimateInr: { type: number }
        teamShape: { type: string }
        timeline: { type: string }
        version: { type: integer, description: Required on update; a stale version returns 409 }
