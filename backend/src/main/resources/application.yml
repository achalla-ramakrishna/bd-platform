# Configuration comes from environment variables in every environment (ADR-0007).
spring:
  application:
    name: bd-platform
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/bd_platform}
    username: ${DATABASE_USERNAME:bd}
    password: ${DATABASE_PASSWORD:bd}
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 22MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid,email,profile
        provider:
          google:
            user-name-attribute: email
  jackson:
    time-zone: Asia/Kolkata

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
      timeout: 12h

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  ai:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
  # Walnut, the BD agent (ADR-0015): who it works with, when it writes the morning plan, links in emails.
  walnut:
    roles: ${WALNUT_ROLES:ADMIN}
    brief-cron: ${WALNUT_BRIEF_CRON:0 30 8 * * MON-FRI}
    zone: ${WALNUT_ZONE:Asia/Kolkata}
    scheduler-enabled: ${WALNUT_SCHEDULER:true}
    base-url: ${APP_BASE_URL:}
  # GTN, Go To Network (ADR-0017): thresholds the team can tune.
  gtn:
    unresponsive-days: ${GTN_UNRESPONSIVE_DAYS:7}
    nudge-spacing-days: ${GTN_NUDGE_SPACING_DAYS:5}
    nudge-cap: ${GTN_NUDGE_CAP:3}
    beep-interval-days: ${GTN_BEEP_INTERVAL_DAYS:30}
    sweep-cron: ${GTN_SWEEP_CRON:0 0 7 * * *}
    zone: ${GTN_ZONE:Asia/Kolkata}
    sweep-enabled: ${GTN_SWEEP:true}
  # GTN phase 3 (ADR-0020): team members connect their own Gmail and Calendar. Off unless GOOGLE_TOKEN_KEY
  # (32 random bytes, base64) is set; uses the sign-in OAuth client.
  google:
    client-id: ${GOOGLE_CLIENT_ID:not-configured}
    client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
    token-key: ${GOOGLE_TOKEN_KEY:}
    poll-minutes: ${GTN_REPLY_POLL_MINUTES:10}
    poll-enabled: ${GTN_REPLY_POLL:true}
  # Email for Walnut's morning plan, through Resend's API. Off unless both are set.
  mail:
    api-key: ${MAIL_API_KEY:}
    from: ${MAIL_FROM:}
  security:
    allowed-domain: ${ALLOWED_DOMAIN:codewalnut.com}
    bootstrap-admins: ${BOOTSTRAP_ADMINS:}
    dev-login: ${DEV_LOGIN:false}
    dev-password: ${DEV_PASSWORD:}
  # Research upload by script (ADR-0010). Off unless RESEARCH_UPLOAD_TOKEN (32+ characters) is set.
  # The token acts as the user named in RESEARCH_UPLOAD_AS, who needs a pipeline role.
  research-upload:
    token: ${RESEARCH_UPLOAD_TOKEN:}
    as: ${RESEARCH_UPLOAD_AS:}
